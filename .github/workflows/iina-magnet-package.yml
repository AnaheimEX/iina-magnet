name: iina-magnet package

# CI for the iina-magnet SPM package: build + test the IinaMagnet / AnitomyBridge
# targets. (The old LibtorrentBridge target and the vendored lib/libtorrent were
# removed when the project pivoted to PikPak for offline downloads.)

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'sync/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  swift-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Build IinaMagnet package
        working-directory: iina-magnet
        run: swift build

      - name: Test IinaMagnet package
        working-directory: iina-magnet
        run: swift test
