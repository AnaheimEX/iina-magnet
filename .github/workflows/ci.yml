name: CI

on:
  push:
      branches: [develop]
  pull_request:
      branches: [develop]
  # MARK: iina-magnet hook — allow manual dispatch from feature/sync branches
  # so we can verify integration without merging into develop.
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "26.5"
            deployment_target: ""
    runs-on:  macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: ./other/download_libs.sh $DOWNLOAD_LIBS_ARGS
        env:
          DOWNLOAD_LIBS_ARGS: ${{ github.event_name == 'pull_request' && '--skip-plugins' || '' }}
          # MARK: iina-magnet hook — repo is checked out as `iina-magnet/`, override the script's hardcoded 'iina'
          PROJECT_NAME: iina-magnet

      - name: Build
        # MARK: iina-magnet hook — pin DerivedData path so Archive step doesn't depend on Xcode's
        # workdir-derived hash (the fork repo dir differs from upstream's, breaking the hardcoded hash)
        run: xcodebuild -project iina.xcodeproj -derivedDataPath build ONLY_ACTIVE_ARCH=NO -scheme iina -configuration Nightly ${{ matrix.deployment_target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Archive
        # MARK: iina-magnet hook — read from pinned derivedDataPath instead of hashed upstream path
        run: tar cvJf ~/iina.tar.xz -C build/Build/Products/Nightly IINA.app

      - name: Save artifacts
        uses: actions/upload-artifact@v6
        with:
          name: IINA
          path: ~/iina.tar.xz
